name: Build Dropbear arm-linux-gnueabihf
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: Download dropbear source
        run: |
          wget https://mjt.dtnsm.ch/source/dropbear-2026.94.tar.gz
          tar xf dropbear-2026.94.tar.gz

      - name: Build dropbear
        run: |
          set -e
          cd dropbear-2026.94
          # 编译器自检
          echo 'int main(){return 0;}' > test.c
          arm-linux-gnueabihf-gcc test.c -o test.elf
          file test.elf
          rm test.c test.elf

          ./configure \
            --host=arm-linux-gnueabihf \
            CC=arm-linux-gnueabihf-gcc \
            --enable-static \
            --disable-zlib \
            --disable-pam \
            --disable-wtmp \
            --disable-utmp \
            --disable-syslog \
            --enable-bundled-libtom \
            --prefix=/tmp/out \
            LIBS="-lcrypt"

          PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1 make -j$(nproc)
          arm-linux-gnueabihf-strip dropbearmulti
          file dropbearmulti
          cp dropbearmulti ../dropbearmulti-armv7l-gnueabihf
          sha256sum dropbearmulti > ../sha256sum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-armv7l-gnueabihf
          path: |
            dropbearmulti-armv7l-gnueabihf
            sha256sum.txt
