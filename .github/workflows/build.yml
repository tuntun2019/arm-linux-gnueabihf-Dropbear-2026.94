name: Build Dropbear 2026.94 armv7 static
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross toolchain + libcrypt-dev
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf make wget bzip2 file libcrypt-dev

      - name: Download dropbear 2026.94 source
        run: |
          wget https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2
          tar -jxvf dropbear-2026.94.tar.bz2
          cd dropbear-2026.94

      - name: Configure & compile static multi
        run: |
          cd dropbear-2026.94
          ./configure \
            --host=arm-linux-gnueabihf \
            --enable-static \
            --disable-zlib \
            --disable-pam \
            --disable-wtmp \
            --disable-utmp \
            --disable-syslog \
            --enable-bundled-libtom \
            --prefix=/tmp/out \
            LIBS="-lcrypt"
          PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp" MULTI=1 make -j$(nproc)
          arm-linux-gnueabihf-strip dropbearmulti
          file dropbearmulti
          cp dropbearmulti ../dropbearmulti-armv7l-gnueabihf
          sha256sum dropbearmulti > ../sha256sum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-2026.94-armv7l-static
          path: |
            dropbearmulti-armv7l-gnueabihf
            sha256sum.txt
