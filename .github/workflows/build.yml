name: Build Dropbear 2026.94 armv7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DROPBEAR_VER: "2026.94"
  DROPBEAR_URL: "https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2"
  SHA256: "e098034a843699200c8c977a991fff73159735bf795d5f72ef672c41a6b1ae81"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [armv7]
    steps:
      - name: Install cross compile deps
        run: |
          sudo apt update
          sudo apt install -y build-essential bzip2 libz-dev pkg-config crossbuild-essential-armhf

      - name: Download source & verify
        run: |
          wget -O dropbear-${{ env.DROPBEAR_VER }}.tar.bz2 ${{ env.DROPBEAR_URL }}
          echo "${{ env.SHA256 }}  dropbear-${{ env.DROPBEAR_VER }}.tar.bz2" | sha256sum -c
          tar -xf dropbear-${{ env.DROPBEAR_VER }}.tar.bz2

      - name: Configure & compile static
        run: |
          cd dropbear-${{ env.DROPBEAR_VER }}
          ./configure \
            --enable-static \
            --disable-shared \
            --host=arm-linux-gnueabihf \
            CC=arm-linux-gnueabihf-gcc
          make -j$(nproc) PROGRAMS="dropbear dbclient dropbearkey dropbearconvert scp"

      - name: Collect binaries
        run: |
          mkdir -p out/${{ matrix.arch }}
          cp dropbear-${{ env.DROPBEAR_VER }}/dropbear out/${{ matrix.arch }}/
          cp dropbear-${{ env.DROPBEAR_VER }}/dbclient out/${{ matrix.arch }}/
          cp dropbear-${{ env.DROPBEAR_VER }}/dropbearkey out/${{ matrix.arch }}/
          cp dropbear-${{ env.DROPBEAR_VER }}/dropbearconvert out/${{ matrix.arch }}/
          cp dropbear-${{ env.DROPBEAR_VER }}/scp out/${{ matrix.arch }}/
          file out/${{ matrix.arch }}/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-${{ env.DROPBEAR_VER }}-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/
