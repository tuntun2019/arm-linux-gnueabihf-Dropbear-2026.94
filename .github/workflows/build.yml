name: Build Dropbear
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf bzip2 wget make

      - name: Download & compile Dropbear
        run: |
          VER=2026.94
          wget https://matt.ucc.asn.au/dropbear/releases/dropbear-${VER}.tar.bz2
          tar -jxf dropbear-${VER}.tar.bz2
          cd dropbear-${VER}
          ./configure \
            --host=arm-linux-gnueabihf \
            --enable-static \
            --enable-bundled-libtom \
            --disable-zlib \
            --disable-utmp --disable-utmpx --disable-wtmp --disable-wtmpx \
            --disable-pututxline --disable-loginfunc \
            --prefix=/usr
          # 关键：静态链接 libcrypt
          make -j$(nproc) STATIC_LIBS="-lcrypt"
          arm-linux-gnueabihf-strip dropbear dropbearkey dbclient
          ls -lh dropbear dropbearkey dbclient
          mkdir -p out
          cp dropbear dropbearkey dbclient out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-arm-gnueabihf
          path: dropbear-2026.94/out/
